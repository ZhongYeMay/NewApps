<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f2f2f7" id="themeColor"><title>关于本机</title><link rel="stylesheet" href="style.css?v=5"></head><body class="new"><div class="app" id="app"><div class="status"><span id="clock">9:41</span><span class="icons"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="wifi">⌁</span><span class="bat"><b></b></span></span></div><div class="nav"><button class="back" id="back">设置</button><h1>关于本机</h1><button class="more" id="open">•••</button></div><div class="large">关于本机</div><main class="content"><section class="section"><div class="card"><div class="row"><div class="k">名称</div><div class="v" id="name">iPhone</div><span></span></div><div class="row"><div class="k">iOS 版本</div><div class="v" id="ios">27.0</div><span class="chev"></span></div><div class="row"><div class="k">机型名称</div><div class="v" id="model">iPhone 18 Pro</div><span></span></div><div class="row"><div class="k">处理器</div><div class="v" id="cpu">浏览器不可读取</div><span></span></div><div class="row"><div class="k">内存</div><div class="v" id="ram">浏览器不可读取</div><span></span></div></div></section><section class="section"><div class="label">存储空间</div><div class="card"><div class="storage"><div class="storage-head"><span>iPhone 存储空间</span><span id="storageText">未设置</span></div><div class="bar"><i id="storageBar"></i></div><div class="note" id="storageNote">Safari 不允许网页读取整机存储空间，可在右上角手动设置。</div></div></div></section><section class="section"><div class="label">浏览器检测</div><div class="card"><div class="row"><div class="k">设备类型</div><div class="v" id="type">—</div><span></span></div><div class="row"><div class="k">屏幕分辨率</div><div class="v" id="screen">—</div><span></span></div><div class="row"><div class="k">显示缩放</div><div class="v" id="dpr">—</div><span></span></div><div class="row"><div class="k">浏览器</div><div class="v" i
