<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f2f7" id="themeColor">
<title>关于本机</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sub:#8e8e93;--line:#c6c6c8;--blue:#007aff;--radius:13px;--row:50px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}
.app{width:min(100%,500px);min-height:100vh;margin:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.status{height:calc(env(safe-area-inset-top) + 38px);padding:env(safe-area-inset-top) 20px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700}.icons{display:flex;align-items:center;gap:6px}.sig{display:flex;gap:1.5px;align-items:end}.sig i{display:block;width:3px;border-radius:1px;background:currentColor}.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:10px}.wifi{font-size:15px}.bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;padding:1.5px}.bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}.bat b{display:block;width:78%;height:100%;background:currentColor;border-radius:2px}
.nav{height:50px;display:grid;grid-template-columns:92px 1fr 92px;align-items:center;padding:0 10px;position:sticky;top:0;z-index:10;background:rgba(249,249,249,.88);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-bottom:.5px solid rgba(60,60,67,.22)}.nav h1{margin:0;text-align:center;font-size:17px;font-weight:600}.back{border:0;background:transparent;color:var(--blue);font-size:17px;padding:6px 2px;text-align:left}.more{justify-self:end;width:34px;height:34px;border:0;border-radius:50%;background:rgba(118,118,128,.12);color:var(--blue);font-size:20px;line-height:1;padding-bottom:8px}
.large{display:none;font-size:34px;line-height:42px;font-weight:700;padding:12px 20px 6px}.content{padding:10px 16px}.section{margin:16px 0 24px}.label{font-size:13px;color:var(--sub);padding:0 16px 7px}.card{background:var(--card);border-radius:var(--radius);overflow:hidden}.row{min-height:var(--row);display:grid;grid-template-columns:minmax(112px,1fr) minmax(0,1.35fr) auto;align-items:center;gap:8px;padding:0 16px;position:relative}.row:after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--line);opacity:.45}.row:last-child:after{display:none}.k{font-size:17px}.v{font-size:17px;color:var(--sub);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{width:8px;height:8px;border-right:1.8px solid #b0b0b5;border-top:1.8px solid #b0b0b5;transform:rotate(45deg);margin-left:2px}.action{grid-template-columns:1fr}.action .k{text-align:center;color:var(--blue);font-weight:500}.action:active{background:rgba(118,118,128,.10)}
.storage{padding:16px}.storage-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.storage-head span:last-child{font-size:14px;color:var(--sub)}.bar{height:9px;border-radius:6px;background:#e5e5ea;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#0a84ff;border-radius:inherit;transition:.25s}.note{font-size:12px;color:var(--sub);line-height:1.45;margin-top:8px}.foot{font-size:13px;color:var(--sub);line-height:1.45;padding:0 16px;margin-top:7px}
body.old{--radius:10px;--row:46px}body.old .nav{position:relative;background:#f8f8f8}body.old .nav h1{visibility:hidden}body.old .large{display:block}body.old .content{padding-top:0}
body.modern{--radius:13px;--row:50px}
/* iOS 26/27: based on current Apple Settings visual language */
body.new{--bg:#f4f4f6;--card:rgba(255,255,255,.82);--text:#111;--sub:#8a8a90;--line:rgba(60,60,67,.14);--radius:28px;--row:58px;background:radial-gradient(80% 34% at 85% -2%,rgba(217,224,239,.72),transparent 72%),linear-gradient(180deg,#f6f5f8 0%,#f1f1f4 48%,#f5f5f7 100%)}
body.new .status{padding-left:22px;padding-right:22px;color:#000}
body.new .nav{height:62px;grid-template-columns:58px 1fr 58px;padding:0 14px;background:rgba(246,246,248,.34);border:0;backdrop-filter:blur(24px) saturate(1.15);-webkit-backdrop-filter:blur(24px) saturate(1.15)}body.new .nav h1{font-size:18px;font-weight:650;letter-spacing:-.15px}body.new .back{width:46px;height:46px;border-radius:50%;font-size:0;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.92);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 3px 12px rgba(65,70,84,.10);position:relative}body.new .back:before{content:"";position:absolute;width:12px;height:12px;border-left:2.5px solid #111;border-bottom:2.5px solid #111;transform:rotate(45deg);left:18px;top:15px}body.new .more{width:46px;height:46px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.92);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 3px 12px rgba(65,70,84,.10);color:#111;font-size:22px;padding-bottom:9px}body.new .content{padding:9px 20px 0}body.new .section{margin:14px 0 24px}body.new .label{padding:0 17px 8px;color:#77777d}body.new .card{border:1px solid rgba(255,255,255,.94);box-shadow:inset 0 1px 0 rgba(255,255,255,.86),0 7px 24px rgba(70,76,90,.05);backdrop-filter:blur(28px) saturate(1.1);-webkit-backdrop-filter:blur(28px) saturate(1.1)}body.new .row{padding:0 17px;grid-template-columns:minmax(104px,1fr) minmax(0,1.36fr) auto}body.new .row:after{left:17px;right:17px;opacity:1}body.new .k{color:#111;letter-spacing:-.12px}body.new .v{color:#8a8a90}body.new .chev{width:9px;height:9px;border-width:2px 2px 0 0}body.new .storage{padding:17px}body.new .bar{background:#dedee2}body.new .foot{padding:0 17px}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}.scrim.show{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:50;left:50%;bottom:0;width:min(100%,500px);max-height:88vh;transform:translate(-50%,105%);transition:.28s cubic-bezier(.25,.8,.25,1);background:#f2f2f7;color:#000;border-radius:22px 22px 0 0;overflow:hidden;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -18px 60px rgba(0,0,0,.22)}.sheet.show{transform:translate(-50%,0)}.grab{width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:8px auto 4px}.sheetnav{height:48px;display:grid;grid-template-columns:86px 1fr 86px;align-items:center;padding:0 12px}.sheetnav h2{font-size:17px;text-align:center;margin:0}.sheetnav button{border:0;background:transparent;color:#007aff;font-size:17px}.sheetnav .done{text-align:right;font-weight:650}.sheetbody{max-height:calc(88vh - 60px);overflow:auto;padding:4px 16px 26px}.sheet .section{margin:16px 0}.sheet .card{border-radius:13px;background:#fff}.form{padding:10px 16px;min-height:55px;border-bottom:.5px solid #d1d1d6}.form:last-child{border-bottom:0}.form label{display:block;font-size:12px;color:#8e8e93;margin-bottom:5px}.form input,.form select{width:100%;border:0;outline:0;background:transparent;color:#000;font-size:17px;padding:0}.vers{display:flex;gap:8px;overflow:auto;padding:2px 0 7px;scrollbar-width:none}.vers::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:0;border-radius:10px;background:#e5e5ea;color:#3a3a3c;padding:9px 12px}.chip.on{background:#007aff;color:#fff}.seg{display:grid;grid-template-columns:1fr 1fr;background:#e3e3e8;border-radius:9px;padding:2px}.seg button{border:0;background:transparent;border-radius:7px;padding:7px}.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}body.new .sheet{width:min(calc(100% - 16px),484px);bottom:8px;border-radius:32px;background:rgba(245,245,247,.90);backdrop-filter:blur(34px) saturate(1.2);-webkit-backdrop-filter:blur(34px) saturate(1.2)}body.new .sheet .card{border-radius:24px;background:rgba(255,255,255,.80);border:1px solid rgba(255,255,255,.92)}body.new .chip{border-radius:999px;padding:9px 14px}body.new .chip.on{background:#111}body.new .seg{border-radius:999px;padding:3px}body.new .seg button{border-radius:999px}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translate(-50%,12px);opacity:0;pointer-events:none;background:rgba(25,25,25,.88);color:#fff;border-radius:999px;padding:10px 15px;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){body{padding:18px 0}.app{min-height:calc(100vh - 36px);border-radius:34px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.15)}}
</style>
</head>
<body class="new">
<div class="app">
  <div class="status"><span id="clock">9:41</span><span class="icons"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="wifi">⌁</span><span class="bat"><b></b></span></span></div>
  <div class="nav"><button class="back" id="back">设置</button><h1>关于本机</h1><button class="more" id="open">•••</button></div>
  <div class="large">关于本机</div>
  <main class="content">
    <section class="section"><div class="card">
      <div class="row"><div class="k">名称</div><div class="v" id="name">iPhone</div><span></span></div>
      <div class="row"><div class="k">iOS 版本</div><div class="v" id="ios">27.0</div><span class="chev"></span></div>
      <div class="row"><div class="k">机型名称</div><div class="v" id="model">iPhone 18 Pro</div><span></span></div>
      <div class="row"><div class="k">处理器</div><div class="v" id="cpu">浏览器不可读取</div><span></span></div>
      <div class="row"><div class="k">内存</div><div class="v" id="ram">浏览器不可读取</div><span></span></div>
    </div></section>
    <section class="section"><div class="label">存储空间</div><div class="card"><div class="storage"><div class="storage-head"><span>iPhone 存储空间</span><span id="storageText">未设置</span></div><div class="bar"><i id="storageBar"></i></div><div class="note" id="storageNote">Safari 不允许网页读取整机存储空间，可在右上角手动设置。</div></div></div></section>
    <section class="section"><div class="label">浏览器检测</div><div class="card">
      <div class="row"><div class="k">设备类型</div><div class="v" id="type">—</div><span></span></div>
      <div class="row"><div class="k">屏幕分辨率</div><div class="v" id="screen">—</div><span></span></div>
      <div class="row"><div class="k">显示缩放</div><div class="v" id="dpr">—</div><span></span></div>
      <div class="row"><div class="k">浏览器</div><div class="v" id="browser">—</div><span></span></div>
      <div class="row"><div class="k">逻辑处理器</div><div class="v" id="cores">—</div><span></span></div>
      <div class="row"><div class="k">触控点</div><div class="v" id="touch">—</div><span></span></div>
      <div class="row"><div class="k">网页存储配额</div><div class="v" id="quota">检测中…</div><span></span></div>
    </div><div class="foot">网页只能读取浏览器公开的信息。RAM、真实机型、整机存储和精确系统版本在 Safari 中通常无法直接获取。</div></section>
    <section class="section"><div class="card"><div class="row action" id="redetect"><div class="k">重新检测</div></div><div class="row action" id="copy"><div class="k">复制设备报告</div></div></div></section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet"><div class="grab"></div><div class="sheetnav"><button id="reset">还原</button><h2>显示设置</h2><button class="done" id="done">完成</button></div><div class="sheetbody">
  <section class="section"><div class="label">iOS 版本</div><div class="vers" id="vers"></div><div class="card"><div class="form"><label>小版本号</label><input id="minor" inputmode="decimal" value="0"></div><div class="form"><label>版本来源</label><div class="seg"><button id="manual" class="on" type="button">手动选择</button><button id="auto" type="button">尝试检测</button></div></div></div></section>
  <section class="section"><div class="label">设备</div><div class="card"><div class="form"><label>机型名称</label><select id="modelSelect"><option>iPhone 18 Pro</option><option>iPhone 18 Pro Max</option><option>iPhone 17 Pro</option><option>iPhone 17 Pro Max</option><option>iPhone 16 Pro</option><option>iPhone 16 Pro Max</option><option>iPhone 15 Pro</option><option>iPhone 15 Pro Max</option><option>iPhone 14 Pro</option><option>iPhone 13 Pro</option><option>iPhone 12 Pro</option><option>iPhone 11 Pro</option><option>iPhone SE</option><option>iPad</option><option value="custom">自定义</option></select></div><div class="form hidden" id="customRow"><label>自定义名称</label><input id="customName" placeholder="例如 我的 iPhone"></div></div></section>
  <section class="section"><div class="label">手动硬件信息</div><div class="card"><div class="form"><label>处理器</label><input id="cpuInput" placeholder="例如 A18 Pro"></div><div class="form"><label>RAM</label><input id="ramInput" placeholder="例如 8 GB"></div><div class="form"><label>总存储 GB</label><input id="total" type="number" min="0" inputmode="decimal" placeholder="256"></div><div class="form"><label>已使用 GB</label><input id="used" type="number" min="0" inputmode="decimal" placeholder="128"></div></div></section>
</div></section>
<div class="toast" id="toast">已完成</div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const versions=[12,13,14,15,16,17,18,26,27];const D={major:27,minor:'0',mode:'manual',model:'iPhone 18 Pro',custom:'',cpu:'',ram:'',total:'',used:''};let s={...D};try{s={...D,...JSON.parse(localStorage.getItem('ios-device-v4')||'{}')}}catch(e){}const save=()=>localStorage.setItem('ios-device-v4',JSON.stringify(s));function detectVersion(){const u=navigator.userAgent||'';let m=u.match(/OS (\d+)[._](\d+)/)||u.match(/Version\/(\d+)(?:\.(\d+))?/);return m?{major:+m[1],minor:m[2]||'0'}:null}function ver(){if(s.mode==='auto'){const d=detectVersion();if(d)return d}return{major:+s.major||27,minor:String(s.minor||'0')}}function name(){return s.model==='custom'?(s.custom.trim()||'iPhone'):s.model}function browser(){const u=navigator.userAgent||'';return /CriOS/.test(u)?'Chrome':/FxiOS/.test(u)?'Firefox':/EdgiOS/.test(u)?'Edge':/Safari/.test(u)?'Safari':'其他浏览器'}function ios(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(/MacIntel/.test(navigator.platform)&&navigator.maxTouchPoints>1)}function theme(v){document.body.className=v<=15?'old':v<=18?'modern':'new';$('themeColor').content=v<=18?'#f2f2f7':'#f4f4f6'}function sync(){const v=ver();theme(v.major);$('name').textContent=name();$('ios').textContent=v.major+'.'+v.minor+(s.mode==='auto'?'（检测）':'');$('model').textContent=s.model==='custom'?'自定义':s.model;$('cpu').textContent=s.cpu.trim()||'浏览器不可读取';$('ram').textContent=s.ram.trim()||(navigator.deviceMemory?navigator.deviceMemory+' GB（浏览器提示）':'浏览器不可读取');const t=parseFloat(s.total),u0=parseFloat(s.used);if(Number.isFinite(t)&&t>0){const u=Number.isFinite(u0)?Math.max(0,Math.min(u0,t)):0;$('storageText').textContent=(Number.isFinite(u0)?u.toFixed(u%1?1:0)+' GB / ':'')+t.toFixed(t%1?1:0)+' GB';$('storageBar').style.width=(u/t*100)+'%';$('storageNote').textContent='存储容量为手动填写值。'}else{$('storageText').textContent='未设置';$('storageBar').style.width='0%';$('storageNote').textContent='Safari 不允许网页读取整机存储空间，可在右上角手动设置。'}$('type').textContent=ios()?'Apple 移动设备':(/Mobi/.test(navigator.userAgent)?'移动设备':'桌面设备');$('screen').textContent=Math.round(screen.width*devicePixelRatio)+' × '+Math.round(screen.height*devicePixelRatio);$('dpr').textContent=(devicePixelRatio||1)+'×';$('browser').textContent=browser();$('cores').textContent=navigator.hardwareConcurrency?navigator.hardwareConcurrency+' 个':'不可读取';$('touch').textContent=(navigator.maxTouchPoints||0)+' 点';$('minor').value=s.minor;$('modelSelect').value=s.model;$('customName').value=s.custom;$('cpuInput').value=s.cpu;$('ramInput').value=s.ram;$('total').value=s.total;$('used').value=s.used;$('customRow').classList.toggle('hidden',s.model!=='custom');$('manual').classList.toggle('on',s.mode==='manual');$('auto').classList.toggle('on',s.mode==='auto');document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',+x.dataset.v===+s.major))}async function quota(){try{const x=await navigator.storage?.estimate?.();$('quota').textContent=x?.quota?fmt(x.quota):'不可读取'}catch(e){$('quota').textContent='不可读取'}}function fmt(n){const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(n>=100?0:n>=10?1:2)+' '+u[i]}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1400)}function open(){document.body.style.overflow='hidden';$('scrim').classList.add('show');$('sheet').classList.add('show')}function close(){document.body.style.overflow='';$('scrim').classList.remove('show');$('sheet').classList.remove('show')}function pull(){s.minor=$('minor').value.replace(/[^0-9.]/g,'').slice(0,8)||'0';s.model=$('modelSelect').value;s.custom=$('customName').value;s.cpu=$('cpuInput').value;s.ram=$('ramInput').value;s.total=$('total').value;s.used=$('used').value;if(s.mode==='auto'){const d=detectVersion();if(d){s.major=d.major;s.minor=d.minor}}save();sync()}function report(){const v=ver();return['设备信息','名称: '+name(),'显示系统: iOS '+v.major+'.'+v.minor,'浏览器: '+browser(),'设备类型: '+$('type').textContent,'屏幕: '+$('screen').textContent,'DPR: '+(devicePixelRatio||1),'逻辑处理器: '+(navigator.hardwareConcurrency||'不可读取'),'触控点: '+(navigator.maxTouchPoints||0),'User-Agent: '+navigator.userAgent].join('\n')}async function copy(){try{await navigator.clipboard.writeText(report())}catch(e){const t=document.createElement('textarea');t.value=report();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast('设备报告已复制')}versions.forEach(v=>{const b=document.createElement('button');b.className='chip';b.dataset.v=v;b.textContent='iOS '+v;b.onclick=()=>{s.major=v;s.mode='manual';save();sync()};$('vers').appendChild(b)});$('open').onclick=open;$('scrim').onclick=close;$('done').onclick=()=>{pull();close()};$('reset').onclick=()=>{s={...D};save();sync();toast('已还原')};$('manual').onclick=()=>{s.mode='manual';save();sync()};$('auto').onclick=()=>{s.mode='auto';const d=detectVersion();if(d){s.major=d.major;s.minor=d.minor;toast('已读取浏览器提供的版本信息')}else toast('浏览器未公开系统版本');save();sync()};$('modelSelect').onchange=pull;['minor','customName','cpuInput','ramInput','total','used'].forEach(id=>$(id).addEventListener('change',pull));$('redetect').onclick=()=>{sync();quota();toast('已重新检测')};$('copy').onclick=copy;$('back').onclick=()=>toast('这是网页模拟界面');function clock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false})}clock();setInterval(clock,30000);sync();quota();window.addEventListener('resize',sync)})();
</script>
</body>
</html>
