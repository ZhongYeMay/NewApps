<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#536fa6"><title>iOS 设备信息</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:white;min-height:100vh;background:linear-gradient(145deg,#4969a7,#8996b6 55%,#75b2d6);transition:background .4s}body.classic{background:#f2f2f7;color:#17171a}body.modern{background:linear-gradient(145deg,#344c88,#777eae,#7baad4)}main{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 32px) 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top h1{font-size:22px;margin:0}.gear{border:1px solid #ffffff70;border-radius:50%;background:#ffffff19;color:inherit;width:50px;height:50px;font-size:25px}.hero{border-radius:29px;min-height:325px;background:linear-gradient(155deg,#141342 0%,#292d84 48%,#2567d0 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:17px}.hero:before,.hero:after{content:"";position:absolute;width:160%;height:130px;left:-20%;border-radius:50%;border-top:2px solid #72c7e8;transform:rotate(-10deg);top:23%;opacity:.75}.hero:after{top:66%;border-color:#b19cd5;opacity:.5}.logo{font-size:65px;letter-spacing:-3px;z-index:1;font-weight:300}.version{font-size:23px;z-index:1}.current{margin-top:65px;background:#ffffff35;border:1px solid #ffffff30;border-radius:30px;padding:12px 25px;z-index:1}.panel{background:#ffffff2b;border:1px solid #ffffff5b;border-radius:29px;padding:12px 22px;margin-bottom:16px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}.classic .panel{background:white;border-color:#e4e4e8;border-radius:14px}.classic .hero{border-radius:14px}.modern .panel{border-radius:21px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0;border-bottom:1px solid #ffffff35}.line:last-child{border-bottom:0}.classic .line{border-color:#ddd}.val{text-align:right;opacity:.86;overflow-wrap:anywhere}.device{font-size:25px;font-weight:650;margin:16px 0 2px}.sub{opacity:.7;margin-bottom:18px}.bar{height:10px;background:#24394e;border-radius:10px;overflow:hidden;margin:4px 0 10px}.bar span{display:block;width:0;height:100%;background:linear-gradient(90deg,#315cff,#49a9ff)}dialog{border:0;border-radius:22px;padding:22px;background:#f7f8ff;color:#151923;width:min(92vw,410px);box-shadow:0 12px 60px #0005}dialog::backdrop{background:#0008}label{display:block;font-size:13px;margin:14px 0 5px}select,input{width:100%;padding:12px;border:1px solid #cdd2dd;border-radius:11px;background:white;font:inherit}button.save{background:#2865dd;color:white;border:0;border-radius:12px;padding:13px;width:100%;margin-top:22px;font:inherit}.note{font-size:12px;opacity:.72;line-height:1.6}</style></head><body><main><div class="top"><span></span><h1>情報 · 设备信息</h1><button class="gear" id="settings" aria-label="设置">•••</button></div><section class="hero"><div class="logo">● iOS</div><div class="version" id="heroVersion">27.0</div><div class="current">当前版本 · 現在のバージョン</div></section><section class="panel"><div class="line"><span>设备名称</span><span class="val" id="deviceName">iPhone</span></div><div class="line"><span>存储空间</span><span class="val" id="storage">浏览器无法读取</span></div><div class="bar"><span id="storageBar"></span></div></section><section class="panel"><div class="device" id="deviceTitle">iPhone</div><div class="sub" id="deviceCode">设备型号由用户选择</div><div class="line"><span>处理器</span><span class="val" id="cpu">无法检测</span></div><div class="line"><span>RAM</span><span class="val" id="ram">无法检测</span></div></section><section class="panel"><div class="line"><span>OS</span><span class="val" id="os">iOS 27.0（手动选择）</span></div><div class="line"><span>屏幕</span><span class="val" id="screen"></span></div><div class="line"><span>设备像素比</span><span class="val" id="dpr"></span></div><div class="line"><span>浏览器</span><span class="val" id="browser"></span></div><div class="line"><span>平台</span><span class="val" id="platform"></span></div></section><p class="note">屏幕、像素比、浏览器等为实时浏览器检测。设备型号、iOS 版本、RAM、CPU 与存储容量可手动设定，手动值不代表真实硬件检测结果。</p></main><dialog id="dialog"><h2>自定义设备信息</h2><label>iOS 版本</label><select id="ios"></select><label>iOS 小版本</label><input id="minor" value="0" inputmode="numeric"><label>设备型号</label><select id="model"><option>iPhone 18 Pro</option><option>iPhone 18 Pro Max</option><option>iPhone 17 Pro</option><option>iPhone 17 Pro Max</option><option>iPhone 16 Pro Max</option><option>iPhone 16 Pro</option><option>iPhone 15 Pro</option><option>iPhone 14 Pro</option><option>iPhone 13 Pro</option><option>iPhone 12 Pro</option><option>iPhone SE</option><option>iPad</option><option>自定义设备</option></select><label>自定义设备名称（可选）</label><input id="custom" placeholder="iPhone"><label>处理器信息（手动）</label><input id="cpuInput" placeholder="例如：6 核"><label>RAM（手动）</label><input id="ramInput" placeholder="例如：8 GB"><label>总存储空间 GB（手动）</label><input id="total" type="number" min="0" placeholder="例如：256"><label>已使用空间 GB（手动）</label><input id="used" type="number" min="0" placeholder="例如：120"><button class="save" id="save">保存并应用</button></dialog><script>
const $=id=>document.getElementById(id),fields=['ios','minor','model','custom','cpuInput','ramInput','total','used'];for(const n of [...Array(7)].map((_,i)=>12+i).concat([26,27]))$('ios').add(new Option('iOS '+n,n));$('ios').value='27';try{const saved=JSON.parse(localStorage.getItem('iosDeviceSettings')||'{}');for(const f of fields)if(saved[f]!=null)$(f).value=saved[f]}catch(e){}function update(){const v=+$('ios').value,m=String($('minor').value||'0').replace(/[^0-9.]/g,'').slice(0,8),name=$('custom').value.trim()||$('model').value;document.body.className=v<=15?'classic':v<=18?'modern':'';$('heroVersion').textContent=v+'.'+m;$('os').textContent='iOS '+v+'.'+m+'（手动选择）';$('deviceName').textContent=name;$('deviceTitle').textContent=name;$('deviceCode').textContent='手动选择的设备';$('cpu').textContent=$('cpuInput').value||'浏览器无法读取';$('ram').textContent=$('ramInput').value||'浏览器无法读取';const t=+$('total').value,u=+$('used').value;$('storage').textContent=t>0?((u>=0?u.toFixed(2)+' GB / ':'')+t.toFixed(2)+' GB（手动）'):'浏览器无法读取';$('storageBar').style.width=t>0?Math.min(100,Math.max(0,u/t*100))+'%':'0';$('screen').textContent=Math.round(screen.width*devicePixelRatio)+' × '+Math.round(screen.height*devicePixelRatio)+' px';$('dpr').textContent=devicePixelRatio;$('browser').textContent=/CriOS/.test(navigator.userAgent)?'Chrome (iOS)':/FxiOS/.test(navigator.userAgent)?'Firefox (iOS)':/Safari/.test(navigator.userAgent)?'Safari':'其他浏览器';$('platform').textContent=navigator.platform||'未知'}$('settings').onclick=()=>$('dialog').showModal();$('save').onclick=()=>{localStorage.setItem('iosDeviceSettings',JSON.stringify(Object.fromEntries(fields.map(f=>[f,$(f).value]))));update();$('dialog').close()};update();</script></body></html>
